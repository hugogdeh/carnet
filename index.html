    document.querySelectorAll("#view-toggle button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        aState.view = btn.getAttribute("data-view");
        renderPage();
      });
    });
    document.getElementById("btn-add-item").addEventListener("click", function () { openModal(); });
    document.querySelectorAll("#item-list .item-card-main").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-edit-id");
        var item = state.data[aState.view].find(function (it) { return it.id === id; });
        if (item) openModal(null, item);
      });
    });
    document.querySelectorAll("#item-list .card-delete").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = btn.getAttribute("data-id");
        state.data[aState.view] = state.data[aState.view].filter(function (it) { return it.id !== id; });
        saveData();
        renderPage();
      });
    });
    wireModal();
  }

  function isRefModeForced(type) {
    return type === "Boisson"; // les boissons sont toujours en mL, jamais "sans unité"
  }

  // Vérifie qu'un sous-élément "dont" ne dépasse pas son parent (ex : sucres ≤ glucides).
  // Retourne une fonction check() réutilisable pour la validation en direct et au moment d'enregistrer.
  function wireDontValidation(parentId, childId, errorId) {
    var parentEl = document.getElementById(parentId);
    var childEl = document.getElementById(childId);
    var errEl = document.getElementById(errorId);
    if (!parentEl || !childEl || !errEl) return function () { return false; };
    function check() {
      var p = parseFloat(parentEl.value) || 0;
      var c = parseFloat(childEl.value) || 0;
      var invalid = c > p;
      errEl.hidden = !invalid;
      var fieldEl = childEl.closest(".field");
      if (fieldEl) fieldEl.classList.toggle("field-error", invalid);
      return invalid;
    }
    parentEl.addEventListener("input", check);
    childEl.addEventListener("input", check);
    check();
    return check;
  }

  function wireModal() {
    var backdrop = document.getElementById("modal-backdrop");
    if (!backdrop) return;
    document.getElementById("modal-close").addEventListener("click", closeModal);
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeModal(); });

    document.querySelectorAll("#type-toggle button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        aState.modalType = btn.getAttribute("data-type");
        if (isRefModeForced(aState.modalType)) aState.modalRefMode = "grammes";
        aState.modalIngredients = [];
        aState.modalPickedAliment = null;
        rerenderModal();
      });
    });
    document.querySelectorAll("#ref-toggle button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        aState.modalRefMode = btn.getAttribute("data-ref");
        rerenderModal();
      });
    });

    wireCustomSelects({
      "m-ingredient-pick": function (value) {
        aState.modalPickedAliment = value;
      }
    });

    var addIngBtn = document.getElementById("btn-add-ingredient");
    if (addIngBtn) {
      addIngBtn.addEventListener("click", function () {
        var alimentsList = state.data.aliments;
        var alimentId = aState.modalPickedAliment || (alimentsList[0] && alimentsList[0].id);
        if (!alimentId) return;
        var qte = clampNum(document.getElementById("m-ingredient-qte").value, 0.1, 5000, 1);
        aState.modalIngredients.push({ alimentId: alimentId, quantite: qte });
        rerenderModal();
      });
    }
    document.querySelectorAll(".ing-remove-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var idx = parseInt(btn.getAttribute("data-ing-idx"), 10);
        aState.modalIngredients.splice(idx, 1);
        rerenderModal();
      });
    });

    var checkSucres = wireDontValidation("m-gluc", "m-sucres", "err-sucres");
    var checkSatures = wireDontValidation("m-lip", "m-satures", "err-satures");

    if (aState.modalType === "Plat" && aState.modalIngredients.length) {
      applyIngredientTotalsToFields();
      checkSucres();
      checkSatures();
    }

    document.getElementById("m-save").addEventListener("click", function () {
      var nom = document.getElementById("m-nom").value.trim();
      var st = document.getElementById("modal-status");
      if (!nom) {
        st.textContent = "Donne un nom avant d'ajouter.";
        st.className = "status-msg warn";
        return;
      }
      if (checkSucres()) {
        st.textContent = "Les sucres ne peuvent pas dépasser les glucides.";
        st.className = "status-msg warn";
        return;
      }
      if (checkSatures()) {
        st.textContent = "Les acides gras saturés ne peuvent pas dépasser les lipides.";
        st.className = "status-msg warn";
        return;
      }
      var refMode = isRefModeForced(aState.modalType) ? "grammes" : aState.modalRefMode;
      var refQuantite = refMode === "grammes" ? clampNum(document.getElementById("m-refqte").value, 1, 5000, 100) : 1;

      var entry = {
        id: aState.editingId || makeId(),
        nom: nom,
        refMode: refMode,
        refQuantite: refQuantite,
        kcal: clampNum(document.getElementById("m-kcal").value, 0, 9999, 0),
        proteines: clampNum(document.getElementById("m-prot").value, 0, 999, 0),
        glucides: clampNum(document.getElementById("m-gluc").value, 0, 999, 0),
        sucres: clampNum(document.getElementById("m-sucres").value, 0, 999, 0),
        lipides: clampNum(document.getElementById("m-lip").value, 0, 999, 0),
        satures: clampNum(document.getElementById("m-satures").value, 0, 999, 0),
        fibres: clampNum(document.getElementById("m-fibres").value, 0, 999, 0),
        sel: clampNum(document.getElementById("m-sel").value, 0, 999, 0),
        sodium: clampNum(document.getElementById("m-sodium").value, 0, 9999, 0),
        potassium: clampNum(document.getElementById("m-potassium").value, 0, 9999, 0),
        calcium: clampNum(document.getElementById("m-calcium").value, 0, 9999, 0),
        magnesium: clampNum(document.getElementById("m-magnesium").value, 0, 9999, 0),
        fer: clampNum(document.getElementById("m-fer").value, 0, 999, 0),
        silice: clampNum(document.getElementById("m-silice").value, 0, 9999, 0),
        bicarbonates: clampNum(document.getElementById("m-bicarbonates").value, 0, 9999, 0),
        sulfates: clampNum(document.getElementById("m-sulfates").value, 0, 9999, 0),
        chlorures: clampNum(document.getElementById("m-chlorures").value, 0, 9999, 0),
        nitrates: clampNum(document.getElementById("m-nitrates").value, 0, 9999, 0),
        fluor: clampNum(document.getElementById("m-fluor").value, 0, 999, 0),
        vitamineA: clampNum(document.getElementById("m-vitamineA").value, 0, 99999, 0),
        vitamineD: clampNum(document.getElementById("m-vitamineD").value, 0, 9999, 0),
        vitamineE: clampNum(document.getElementById("m-vitamineE").value, 0, 999, 0),
        vitamineK: clampNum(document.getElementById("m-vitamineK").value, 0, 9999, 0),
        vitamineC: clampNum(document.getElementById("m-vitamineC").value, 0, 999, 0),
        vitamineB1: clampNum(document.getElementById("m-vitamineB1").value, 0, 999, 0),
        vitamineB2: clampNum(document.getElementById("m-vitamineB2").value, 0, 999, 0),
        vitamineB3: clampNum(document.getElementById("m-vitamineB3").value, 0, 999, 0),
        vitamineB5: clampNum(document.getElementById("m-vitamineB5").value, 0, 999, 0),
        vitamineB6: clampNum(document.getElementById("m-vitamineB6").value, 0, 999, 0),
        vitamineB9: clampNum(document.getElementById("m-vitamineB9").value, 0, 9999, 0),
        vitamineB12: clampNum(document.getElementById("m-vitamineB12").value, 0, 9999, 0)
      };

      var targetArray = aState.modalType === "Plat" ? "plats" : aState.modalType === "Boisson" ? "boissons" : "aliments";

      if (aState.editingId) {
        // Retire l'ancienne version, où qu'elle se trouve (au cas où le type aurait changé)
        ["aliments", "plats", "boissons"].forEach(function (arr) {
          state.data[arr] = state.data[arr].filter(function (it) { return it.id !== aState.editingId; });
        });
      }
      state.data[targetArray].push(entry);
      saveData();
      aState.view = targetArray;
      closeModal();
      renderPage();
    });
  }

  function clampNum(v, min, max, fallback) {
    var n = parseFloat(v);
    if (isNaN(n)) return fallback;
    if (n < min) n = min;
    if (n > max) n = max;
    return Math.round(n * 10) / 10;
  }

  function setStatus(msg, kind) {
    var el = document.getElementById("data-status");
    if (!el) return;
    el.textContent = msg;
    el.className = "status-msg" + (kind ? " " + kind : "");
  }

  // ============ Export / Import ============
  var SCOPE_LABELS = { tout: "toutes les données", aliments: "aliments", plats: "plats", boissons: "boissons" };

  function buildExportPayload(scope) {
    if (scope === "tout") {
      return Object.assign({ exportScope: "tout" }, state.data);
    }
    var payload = { exportScope: scope };
    payload[scope] = state.data[scope];
    return payload;
  }

  function exportData(scope) {
    scope = scope || "tout";
    var payload = JSON.stringify(buildExportPayload(scope), null, 2);
    var today = new Date().toISOString().slice(0, 10);
    var filename = "carnet-" + scope + "-" + today + ".json";

    // 1) Contexte Claude (artefact) : passe par la capacité downloads.
    if (downloadsApi) {
      setStatus("Préparation du fichier…");
      downloadsApi.save({ filename: filename, data: payload })
        .then(function () { markBackupDone(); setStatus("Sauvegarde enregistrée.", "good"); })
        .catch(function (err) {
          if (err && err.code === "declined") { setStatus("Export annulé."); return; }
          setStatus("Échec de l'export (" + (err && err.code ? err.code : "erreur") + ").", "warn");
        });
      return;
    }

    // 2) App autonome (PWA installée) : feuille de partage native iOS/Android,
    // qui propose "Enregistrer dans Fichiers" — permet de choisir un dossier
    // iCloud Drive et donc de synchroniser entre appareils.
    try {
      var file = new File([payload], filename, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: filename })
          .then(function () { markBackupDone(); setStatus("Sauvegarde partagée.", "good"); })
          .catch(function (err) {
            if (err && err.name === "AbortError") { setStatus("Export annulé."); return; }
            fallbackDownload(payload, filename);
          });
        return;
      }
    } catch (e) { /* tombe sur le téléchargement standard ci-dessous */ }

    // 3) Repli universel (desktop, Android sans partage fichier) : téléchargement Blob.
    fallbackDownload(payload, filename);
  }

  function markBackupDone() {
    try { localStorage.setItem("carnetNutritionLastBackup", new Date().toISOString()); } catch (e) {}
    renderBackupIndicator();
  }

  function renderBackupIndicator() {
    var el = document.getElementById("backup-indicator");
    if (!el) return;
    var raw = null;
    try { raw = localStorage.getItem("carnetNutritionLastBackup"); } catch (e) {}
    if (!raw) {
      el.textContent = "Aucune sauvegarde exportée pour l'instant.";
      el.className = "hint backup-indicator warn";
      return;
    }
    var days = Math.floor((Date.now() - new Date(raw).getTime()) / 86400000);
    var txt = days <= 0 ? "Dernière sauvegarde : aujourd'hui." :
               days === 1 ? "Dernière sauvegarde : hier." :
               "Dernière sauvegarde : il y a " + days + " jours.";
    el.textContent = txt;
    el.className = "hint backup-indicator" + (days >= 7 ? " warn" : "");
  }

  function fallbackDownload(payload, filename) {
    try {
      var blob = new Blob([payload], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      markBackupDone();
      setStatus("Sauvegarde téléchargée.", "good");
    } catch (e) {
      setStatus("Échec du téléchargement sur cet appareil.", "warn");
    }
  }

  function mergeListCategory(cat, items) {
    if (!Array.isArray(items)) return 0;
    var existingIds = {};
    state.data[cat].forEach(function (it) { existingIds[it.id] = true; });
    var added = 0;
    items.forEach(function (item) {
      var copy = Object.assign({}, item);
      if (existingIds[copy.id]) copy.id = makeId(); // évite d'écraser un élément existant portant le même id
      state.data[cat].push(copy);
      existingIds[copy.id] = true;
      added++;
    });
    return added;
  }

  function handleImportFile(ev) {
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var mode = aState.importMode || "ajouter";
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed !== "object") {
          setStatus("Fichier illisible : ce n'est pas un JSON valide.", "warn");
          return;
        }
        // Détection de la portée du fichier : soit indiquée explicitement (nos propres
        // exports), soit déduite (fichier complet = contient l'historique des objectifs).
        var scope = parsed.exportScope ||
          (parsed.objectifsHistory ? "tout" :
           (parsed.aliments && !parsed.plats && !parsed.boissons ? "aliments" :
            (parsed.plats && !parsed.aliments && !parsed.boissons ? "plats" :
             (parsed.boissons && !parsed.aliments && !parsed.plats ? "boissons" : null))));
        if (!scope) {
          setStatus("Fichier non reconnu comme une sauvegarde du carnet.", "warn");
          return;
        }

        var hasDailyData = scope === "tout" &&
          ((parsed.journal && Object.keys(parsed.journal).length > 0) ||
           (parsed.poids && parsed.poids.length > 0));

        if (mode === "ajouter") {
          if (hasDailyData) {
            setStatus("Ce fichier contient des données de suivi journalier (repas et/ou pesées) : impossible de les ajouter à ce qui existe déjà. Choisis \"Tout remplacer\" pour importer ce fichier — cela effacera les données actuelles.", "warn");
            return;
          }
          var addedCount = 0;
          if (scope === "tout") {
            ["aliments", "plats", "boissons"].forEach(function (cat) {
              addedCount += mergeListCategory(cat, parsed[cat]);
            });
          } else {
            addedCount += mergeListCategory(scope, parsed[scope]);
          }
          saveData();
          renderPage();
          setStatus(addedCount + " élément(s) ajouté(s) depuis le fichier.", "good");
        } else {
          // Remplacer
          if (scope === "tout") {
            var merged = Object.assign(freshData(), parsed);
            if (!merged.objectifsHistory || !merged.objectifsHistory.length) {
              merged.objectifsHistory = freshData().objectifsHistory;
            }
            merged.objectifsHistory.sort(function (a, b) { return a.depuis < b.depuis ? -1 : (a.depuis > b.depuis ? 1 : 0); });
            merged.objectifsHistory.forEach(function (v) { if (typeof v.fibres !== "number") v.fibres = 35; });
            delete merged.exportScope;
            state.data = merged;
          } else {
            if (!parsed[scope]) { setStatus("Le fichier ne contient pas de " + SCOPE_LABELS[scope] + ".", "warn"); return; }
            state.data[scope] = parsed[scope];
          }
          saveData();
          renderPage();
          setStatus("Données (" + SCOPE_LABELS[scope] + ") remplacées.", "good");
        }
      } catch (e) {
        setStatus("Fichier illisible : ce n'est pas un JSON valide.", "warn");
      }
    };
    reader.onerror = function () { setStatus("Impossible de lire le fichier.", "warn"); };
    reader.readAsText(file);
    ev.target.value = "";
  }

  // ============ Init ============
  renderShell();
  renderPage();

  // Si le jour change pendant que l'app reste ouverte (à minuit, ou après une
  // mise en arrière-plan prolongée), on rafraîchit tout automatiquement —
  // "Ma journée" doit toujours refléter le jour réel, pas celui du dernier rendu.
  var lastKnownDate = todayISO();
  function checkDateRollover() {
    var current = todayISO();
    if (current !== lastKnownDate) {
      lastKnownDate = current;
      renderShell();
      renderPage();
    }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") checkDateRollover();
  });
  window.addEventListener("focus", checkDateRollover);
  setInterval(checkDateRollover, 60000);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function (e) {
        console.warn("Service worker non enregistré (normal en aperçu Claude) :", e);
      });
    });
  }
})();
</script>
</body>
</html>
